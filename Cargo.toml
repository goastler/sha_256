[workspace]
resolver = "2"
members = ["crates/*", "example"]

[workspace.package]
edition = "2021"
authors = ["George Oastler <goastler4@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/goastler/sha-256"
homepage = "https://github.com/goastler/sha-256"

# Shared release profile tuned for the hashing crates.
# target-cpu is intentionally NOT set to native here: the portable crates must stay
# honestly portable, and the speed crates select CPU instructions at runtime.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
