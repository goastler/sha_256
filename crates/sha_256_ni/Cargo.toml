[package]
name = "sha_256_ni"
version = "0.1.0"
description = "SHA-256 accelerated with Intel SHA-NI (runtime-detected), pure Rust"
keywords = ["sha", "sha256", "sha-ni", "hash", "simd"]
categories = ["algorithms", "cryptography", "hardware-support"]
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "sha_256_ni"
path = "src/lib.rs"

[dependencies]
sha_256 = { path = "../sha_256" }

[dev-dependencies]
sha2 = "0.10.8"
